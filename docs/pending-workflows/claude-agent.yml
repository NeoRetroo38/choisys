# BORRADOR, NO ACTIVO. Vive en docs/ a propósito: subir archivos a .github/workflows exige el permiso `workflow`
# del token de gh (decisión pendiente del dueño). Para activarlo: moverlo a .github/workflows/claude-agent.yml.
# NO ACTIVAR antes de proteger `main` (rama protegida: PR obligatorio, sin push directo), porque el agente tiene
# permiso de escritura en el repositorio.
# NO VERIFICADO: nunca se ha ejecutado; revisar la versión y los parámetros de la acción antes de activarlo.
#
# Qué hace: cuando el dueño comenta "@claude <encargo>" en una issue o PR, arranca un agente de Claude en GitHub.
# Reglas: solo el dueño puede lanzarlo, el agente trabaja en una rama claude/… y abre PR, y NUNCA fusiona.
# Requiere crear el secreto ANTHROPIC_API_KEY en Settings > Secrets (lo crea el dueño; no se versiona).
name: claude-agent
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  agent:
    # Solo el dueño del repositorio y solo si el comentario menciona a @claude.
    # Los agentes comentan con la cuenta del dueño y firman con "[Claude 2]", "[Codex]"...: los comentarios que
    # empiezan por "[" se ignoran para que un comentario de un agente nunca relance el agente en bucle.
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      !startsWith(github.event.comment.body, '[') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Las reglas cerradas de AGENTS.md aplican igual: motor solo en C++, sin secretos, sin coautor en commits.
          claude_args: >-
            --append-system-prompt "Lee AGENTS.md y obedécelo. Trabaja en una rama claude/<tema>, abre un PR que
            empiece por 'Para el dueño' y no fusiones nunca ni hagas push a main."
